name: Deploy ECS Blue-Green

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    # ✅ Checkout
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Configure AWS (OIDC)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.IAM_ROLE }}
        aws-region: ap-south-1

    # ✅ Login to ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    # ✅ Build Docker image
    - name: Build Docker Image
      run: docker build -t chatbot-ui .

    # ✅ Push image to ECR
    - name: Push Docker Image to ECR
      run: |
        docker tag chatbot-ui:latest ${{ secrets.ECR_URI }}:latest
        docker push ${{ secrets.ECR_URI }}:latest

    # ✅ Replace image URI in task definition
    - name: Update Task Definition Image
      run: |
        sed -i "s|IMAGE_URI|${{ secrets.ECR_URI }}:latest|g" taskdef.json

    # ✅ Register new task definition
    - name: Register Task Definition
      id: register-task
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://taskdef.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
        echo "Registered Task Definition: $TASK_DEF_ARN"

    # 🚀 Create AppSpec JSON (safe way)
    - name: Create AppSpec File
      run: |
        cat <<EOF > appspec.json
{
  "version": "1.0",
  "Resources": [
    {
      "TargetService": {
        "Type": "AWS::ECS::Service",
        "Properties": {
          "TaskDefinition": "$TASK_DEF_ARN",
          "LoadBalancerInfo": {
            "ContainerName": "chatbot-container",
            "ContainerPort": 3000
          }
        }
      }
    }
  ]
}
EOF

    # 🚀 Create revision JSON
    - name: Create Revision File
      run: |
        cat <<EOF > revision.json
{
  "revisionType": "AppSpecContent",
  "appSpecContent": {
    "content": "$(cat appspec.json | tr -d '\n' | sed 's/"/\\"/g')"
  }
}
EOF

    # 🚀 Deploy using CodeDeploy
    - name: Deploy using CodeDeploy
      run: |
        aws deploy create-deployment \
          --application-name chatbot-app \
          --deployment-group-name chatbot-group \
          --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
          --revision file://revision.json
