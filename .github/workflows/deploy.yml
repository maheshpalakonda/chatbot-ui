name: Build and Deploy (Blue-Green ECS)

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: chatbot-ui
  ECS_CONTAINER_NAME: chatbot-container
  CODEDEPLOY_APP: chatbot-app
  CODEDEPLOY_GROUP: chatbot-deployment-group

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    # 1. Checkout
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. AWS Auth (OIDC)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::800960611458:role/ecr
        aws-region: ${{ env.AWS_REGION }}

    # 3. ECR Login
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Build Image
    - name: Build Image
      run: |
        docker build \
        --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
        --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
        -t $ECR_REPOSITORY .

    # 5. Tag Image (IMPORTANT)
    - name: Tag Image
      run: |
        IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
        docker tag $ECR_REPOSITORY:latest $IMAGE_URI
        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

    # 6. Push Image
    - name: Push Image
      run: |
        docker push $IMAGE_URI

    # 7. Register NEW Task Definition (CRITICAL STEP)
    - name: Update Task Definition
      run: |
        aws ecs describe-task-definition --task-definition chatbot-task \
        --query taskDefinition > task-definition.json

        jq '.containerDefinitions[0].image = "'$IMAGE_URI'"' task-definition.json > new-task-def.json

        aws ecs register-task-definition \
        --cli-input-json file://new-task-def.json

    # 8. Create AppSpec dynamically
    - name: Create AppSpec
      run: |
        cat <<EOF > appspec.json
        {
          "version": 1,
          "Resources": [
            {
              "TargetService": {
                "Type": "AWS::ECS::Service",
                "Properties": {
                  "TaskDefinition": "chatbot-task",
                  "LoadBalancerInfo": {
                    "ContainerName": "chatbot-container",
                    "ContainerPort": 3000
                  }
                }
              }
            }
          ]
        }
        EOF

    # 9. Trigger Blue-Green Deployment
    - name: Deploy via CodeDeploy
      run: |
        aws deploy create-deployment \
          --application-name $CODEDEPLOY_APP \
          --deployment-group-name $CODEDEPLOY_GROUP \
          --revision revisionType=AppSpecContent,appSpecContent="{content=$(cat appspec.json)}"
