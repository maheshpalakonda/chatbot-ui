name: Deploy ECS Blue-Green

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    # 1️⃣ Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 2️⃣ Configure AWS (OIDC)
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.IAM_ROLE }}
        aws-region: ap-south-1

    # 3️⃣ Login to ECR
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    # 4️⃣ Build Docker image
    - name: Build Docker
      run: docker build -t chatbot-ui .

    # 5️⃣ Push image to ECR
    - name: Push Image
      run: |
        docker tag chatbot-ui:latest ${{ secrets.ECR_URI }}:latest
        docker push ${{ secrets.ECR_URI }}:latest

    # 6️⃣ Replace image in task definition
    - name: Replace image in taskdef
      run: |
        sed -i "s|IMAGE_URI|${{ secrets.ECR_URI }}:latest|g" taskdef.json

    # 7️⃣ Register task definition
    - name: Register Task Definition
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://taskdef.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

    # 8️⃣ Update appspec
    - name: Update appspec
      run: |
        sed -i "s|TASK_DEF_ARN|$TASK_DEF_ARN|g" appspec.yaml

    # 9️⃣ Deploy using CodeDeploy
    - name: Deploy
      run: |
        aws deploy create-deployment \
          --application-name chatbot-app \
          --deployment-group-name chatbot-group \
          --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
          --revision revisionType=AppSpecContent,appSpecContent="{\"content\": \"$(cat appspec.yaml)\"}"
