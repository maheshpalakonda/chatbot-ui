name: Deploy ECS Blue-Green

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    # 1️⃣ Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 2️⃣ Configure AWS (OIDC)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.IAM_ROLE }}
        aws-region: ap-south-1

    # 3️⃣ Login to ECR
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    # 4️⃣ Build Docker image
    - name: Build Docker Image
      run: docker build -t chatbot-ui .

    # 5️⃣ Push image to ECR
    - name: Push Image
      run: |
        docker tag chatbot-ui:latest ${{ secrets.ECR_URI }}:latest
        docker push ${{ secrets.ECR_URI }}:latest

    # 6️⃣ Update image in task definition
    - name: Update Task Definition Image
      run: |
        sed -i "s|IMAGE_URI|${{ secrets.ECR_URI }}:latest|g" taskdef.json

    # 7️⃣ Register new task definition
    - name: Register Task Definition
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://taskdef.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
        echo "Registered: $TASK_DEF_ARN"

    # 8️⃣ Inject Task Definition ARN into appspec.yaml
    - name: Update AppSpec
      run: |
        sed -i "s|TASK_DEF_ARN|$TASK_DEF_ARN|g" appspec.yaml

    # 9️⃣ Create revision.json (safe format)
    - name: Create revision file
      run: |
        CONTENT=$(cat appspec.yaml | sed 's/"/\\"/g' | tr -d '\n')

        echo "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":\"$CONTENT\"}}" > revision.json

    # 🔟 Deploy using CodeDeploy
    - name: Deploy to CodeDeploy
      run: |
        aws deploy create-deployment \
          --application-name chatbot-app \
          --deployment-group-name chatbot-group \
          --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
          --revision file://revision.json
