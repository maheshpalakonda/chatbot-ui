name: Deploy ECS Blue-Green

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    # ✅ Checkout
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Configure AWS (OIDC)
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.IAM_ROLE }}
        aws-region: ap-south-1

    # ✅ Login to ECR
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    # ✅ Build Docker image
    - name: Build Docker Image
      run: docker build -t chatbot-ui .

    # ✅ Push image to ECR
    - name: Push Image
      run: |
        docker tag chatbot-ui:latest ${{ secrets.ECR_URI }}:latest
        docker push ${{ secrets.ECR_URI }}:latest

    # ✅ Replace image URI in task definition
    - name: Update Task Definition Image
      run: |
        sed -i "s|IMAGE_URI|${{ secrets.ECR_URI }}:latest|g" taskdef.json

    # ✅ Register new task definition
    - name: Register Task Definition
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://taskdef.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

    # ✅ Inject new task definition into appspec
    - name: Update AppSpec
      run: |
        sed -i "s|TASK_DEF_ARN|$TASK_DEF_ARN|g" appspec.yaml

    # 🔥 FINAL FIX — use JSON file instead of inline string
    - name: Deploy using CodeDeploy
      run: |
        # Convert YAML → single-line safe string
        CONTENT=$(cat appspec.yaml | sed 's/"/\\"/g' | tr -d '\n')

        # Create revision.json
        echo "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":\"$CONTENT\"}}" > revision.json

        # Deploy
        aws deploy create-deployment \
          --application-name chatbot-app \
          --deployment-group-name chatbot-group \
          --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
          --revision file://revision.json
